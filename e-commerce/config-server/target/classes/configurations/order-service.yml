server:
   port: 8084

spring: 
  datasource:
     url: jdbc:postgresql://localhost:5433/order
     username: postgres
     password: admin
     driver-class-name: org.postgresql.Driver
    
     jpa: 
       hibernate:
         ddl-auto: create
       database: postgresql
       database-platform: org.hibernate.dialect.PostgreSQLDialect

application:
  config:
      customer-url: http://localhost:8082/api/v1/customer
      product-url: http://localhost:8083/api/v1/product
      payment-url: http://localhost:8085/api/v1/payment