server:
   port: 8084

spring: 
  datasource:
     url: jdbc:postgresql://localhost:5433/order
     username: postgres
     password: admin
     driver-class-name: org.postgresql.Driver
    
     jpa: 
       hibernate:
         ddl-auto: create
       database: postgresql
       database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
     producer:
        bootstrap-servers: localhost:9094
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        properties:
           spring.json.type.mapping: orderComfirmation:com.dev.anh.order.kafka.OrderComfirmation

application:
  config:
      customer-url: http://localhost:8082/api/v1/customer
      product-url: http://localhost:8083/api/v1/product
      payment-url: http://localhost:8085/api/v1/payment