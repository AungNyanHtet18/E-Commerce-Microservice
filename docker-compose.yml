services:
  postgres:
    container_name: ms_pg_sql
    image: postgres:16
    environment:
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: admin
       PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
     container_name: ms_pgadmin
     image: dpage/pgadmin4
     environment: 
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}   #if env file does not exist username = pgadmin@pgadmin.org || password = admin
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
        PGADMIN_CONFIG_SERVER_MODE: 'False'
     volumes:
        - pgadmin:/var/lib/pgadmin
     ports: 
        - 5050:80
     networks: 
        - microservices-net
     restart: unless-stopped

  mongodb: 
    container_name: ms_mongo_db
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    networks:
     - microservices-net

  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://root:root@mongodb:27017/?authSource=admin
    ports:
      - 8081:8081
    depends_on:
      - mongodb
    networks:
     - microservices-net
    restart: unless-stopped
  
  kafka:
     container_name: kafka 
     image: apache/kafka:latest
     ports: 
        - "9092:9092" # Internal listener (Docker network)
        - "9094:9094" # External listener (host machine)
     
     environment: 
         KAFKA_NODE_ID: 1 #Unique ID for this Kafka node
         KAFKA_CLUSTER_ID: 'energy-tracker-cluster-1' # Unique Kafka cluster identifier (required for KRaft mode)
         KAFKA_PROCESS_ROLES: 'broker, controller' # Node roles — this instance will act as BOTH a broker and controller
    
         # Controller Quorum Configuration (Raft)
         KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'  # List of controller nodes that form the Raft quorum
         KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'   # Listener name used by controllers for internal Raft communication

         KAFKA_LISTENERS: >  # Define all listener endpoints for this Kafka node
          PLAINTEXT://0.0.0.0:9092,
          CONTROLLER://0.0.0.0:9093,
          EXTERNAL://0.0.0.0:9094
          
         # What each listener advertises to connecting clients
         # Internal (Docker containers): kafka:9092
         # External (host machine): localhost:9094
         KAFKA_ADVERTISED_LISTENERS: >
          PLAINTEXT://kafka:9092,
          EXTERNAL://localhost:9094

         # Maps listener names to their security protocols
         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
          CONTROLLER:PLAINTEXT,
          PLAINTEXT:PLAINTEXT,
          EXTERNAL:PLAINTEXT

         # Which listener brokers should use for internal communication
         KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

         # Single-Node Cluster Safety Settings
         # (because replication >1 would break)
         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
         KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
         KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

         # Broker Defaults & Quality-of-Life Settings
         # Speed up consumer group startup
         KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
         # Auto-create topics if they don't already exist
         KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
         # Default number of partitions per topic
         KAFKA_NUM_PARTITIONS: 1

     volumes:
        - kafka_data:/var/lib/kafka/data
     networks:
        - microservices-net

  kafka-ui:
    container_name: kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8070:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092  # Use internal Docker network name
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
     - microservices-net
    restart: unless-stopped

  mail-dev: 
      container_name: ms_mail_dev
      image: maildev/maildev
      ports: 
        - 1080:1080
        - 1025:1025
        
networks:
   microservices-net:
      driver: bridge

volumes:
     postgres:
     pgadmin:
     mongo:
     kafka_data: